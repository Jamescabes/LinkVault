  #     POSTGRES_USER: postgres
  #     POSTGRES_PASSWORD: postgres
  #   ports:
  #     - '5432:5432'
  #   volumes:
  #     - pg-data:/var/lib/postgresql/data
  #     - ./schema.sql:/docker-entrypoint-initdb.d/schema.sql

volumes:
  redis-data:
